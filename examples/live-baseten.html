<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ProsodySSM live test – Baseten</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: system-ui, sans-serif; max-width: 480px; margin: 2rem auto; padding: 0 1rem; }
    label { display: block; margin-top: 1rem; font-weight: 600; }
    input[type="text"], input[type="password"] { width: 100%; padding: 0.5rem; margin-top: 0.25rem; }
    button { margin-top: 1rem; padding: 0.75rem 1.5rem; font-size: 1rem; cursor: pointer; }
    button:disabled { opacity: 0.6; cursor: not-allowed; }
    #recordBtn { background: #c00; color: #fff; border: none; border-radius: 6px; }
    #recordBtn.recording { background: #600; animation: pulse 1s infinite; }
    @keyframes pulse { 50% { opacity: 0.8; } }
    #result { margin-top: 1rem; padding: 1rem; background: #f0f0f0; border-radius: 6px; white-space: pre-wrap; font-size: 0.9rem; }
    #result.error { background: #fdd; }
    .hint { font-size: 0.85rem; color: #666; margin-top: 0.25rem; }
  </style>
</head>
<body>
  <h1>ProsodySSM live test</h1>
  <p>Record from your mic; audio is sent to the Baseten predict endpoint (same request shape the SDK uses).</p>

  <label for="apiKey">Baseten API key</label>
  <input type="password" id="apiKey" placeholder="Paste your API key" autocomplete="off">
  <p class="hint">From <a href="https://app.baseten.co/settings/account/api_keys" target="_blank">Baseten → API keys</a></p>

  <label for="predictUrl">Predict URL (optional)</label>
  <input type="text" id="predictUrl" placeholder="https://model-XXX.api.baseten.co/environments/production/predict">

  <label for="duration">Record duration (seconds)</label>
  <input type="number" id="duration" value="3" min="1" max="10" style="width: 80px;">

  <button type="button" id="recordBtn">Record and send</button>

  <div id="result"></div>

  <script type="module" src="./live-baseten.mjs"></script>
</body>
</html>
